name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Windows and Linux are built on demand only: Actions tab -> CI -> Run workflow (or `gh workflow run ci.yml`).
  workflow_dispatch:
    inputs:
      sanitizers:
        description: Run the core, engine and plugin-logic tests with AddressSanitizer and UBSan (macOS)
        type: boolean
        default: false
      universal:
        description: macOS universal binary (arm64 + x86_64) instead of arm64 only
        type: boolean
        default: false
      windows:
        description: Build and test Windows
        type: boolean
        default: false
      linux:
        description: Build and test Linux
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
  PLUGINVAL_VERSION: v1.0.4
  # SHA-256 of the pluginval release archives (pinned). The Windows value is the hash seen on the first download
  # on the runner (trust on first use); the project publishes no checksums.
  PLUGINVAL_SHA256_MACOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_SHA256_WINDOWS: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  macos:
    name: macOS (build, tests, pluginval, auval)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Toolchain versions
        run: |
          echo "image: ${ImageVersion:-unknown}"
          sw_vers
          xcodebuild -version
          clang --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Configure
        run: cmake --preset macos-debug -DMIDIMAID_COPY_PLUGINS=ON -DMIDIMAID_UNIVERSAL=${{ inputs.universal && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build --preset macos-debug
      - name: Test
        run: ctest --preset macos-debug --timeout 300
      - name: Install pluginval
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_SHA256_MACOS}  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          echo "PLUGINVAL=$PWD/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"
      - name: pluginval (VST3, AU, AU MIDI-FX)
        run: |
          "$PLUGINVAL" --version
          for plugin in "$HOME/Library/Audio/Plug-Ins/VST3/MidiMaid.vst3" \
                        "$HOME/Library/Audio/Plug-Ins/Components/MidiMaid.component" \
                        "$HOME/Library/Audio/Plug-Ins/Components/MidiMaid MIDI.component"; do
            "$PLUGINVAL" --strictness-level 10 --validate-in-process --validate "$plugin"
          done
      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Mdmi Klrw
          auval -v aumi Mdmf Klrw

  sanitizers:
    name: Sanitizers (ASan + UBSan, macOS)
    if: github.event_name == 'workflow_dispatch' && inputs.sanitizers
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Configure
        run: cmake --preset macos-debug -DMIDIMAID_SANITIZE=ON
      - name: Build (tests without JUCE)
        run: cmake --build --preset macos-debug --target mm_core_tests mm_engine_tests mm_plugin_tests
      - name: Run the tests with the sanitizers
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          build/macos-debug/tests/mm_core_tests
          build/macos-debug/tests/mm_engine_tests
          build/macos-debug/tests/mm_plugin_tests

  windows:
    name: Windows (build, tests, pluginval)
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Toolchain versions
        run: |
          echo "image: $env:ImageVersion"
          echo "MSVC toolset: $env:VCToolsVersion"
          cmake --version | Select-Object -First 1
          ninja --version
      - name: Configure
        run: cmake --preset windows-debug
      - name: Build
        run: cmake --build --preset windows-debug -- -k 0
      - name: Test
        run: ctest --preset windows-debug --timeout 300
      - name: Install pluginval
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower()
          echo "pluginval_Windows.zip sha256: $hash"
          if ($env:PLUGINVAL_SHA256_WINDOWS -ne "" -and $hash -ne $env:PLUGINVAL_SHA256_WINDOWS) { throw "pluginval checksum mismatch" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: pluginval (VST3)
        run: |
          .\pluginval\pluginval.exe --version
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process --validate "build\windows-debug\source\plugin\MidiMaid_artefacts\Debug\VST3\MidiMaid.vst3"

  linux:
    name: Linux (build, tests, VST3 compile)
    if: github.event_name == 'workflow_dispatch' && inputs.linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl-dev xvfb
      - name: Toolchain versions
        run: |
          echo "image: ${ImageVersion:-unknown}"
          lsb_release -d
          g++ --version | head -1
          cmake --version | head -1
          ninja --version
      - name: Configure
        run: cmake --preset linux-debug
      - name: Build (includes the VST3 compile test)
        run: cmake --build --preset linux-debug -- -k 0
      - name: Test
        run: xvfb-run -a ctest --preset linux-debug --timeout 300
